<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web GIS Persebaran Rumah Sakit Lampung Tengah</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #003b5c, #0077a3);
      color: white;
    }

    .container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 780px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 25px;
      padding: 45px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ffd54f;
      margin-bottom: 25px;
      background: white;
    }

    h1 {
      font-size: 34px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    h2 {
      font-size: 23px;
      color: #ffd54f;
      margin-bottom: 35px;
    }

    .info {
      width: 100%;
      max-width: 530px;
      margin: 0 auto 35px auto;
      text-align: left;
      font-size: 18px;
      line-height: 2;
    }

    .row {
      display: grid;
      grid-template-columns: 150px 20px 1fr;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 4px 0;
    }

    .btn {
      display: inline-block;
      padding: 16px 45px;
      background: #ffd54f;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 40px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .btn:hover {
      background: #ffca28;
      transform: translateY(-3px);
    }

    .map-preview {
      margin-top: 45px;
      width: 100%;
      height: 450px;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.4);
      background: white;
    }

    .map-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #eeeeee;
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 18px;
      }

      .info {
        font-size: 15px;
      }

      .row {
        grid-template-columns: 100px 15px 1fr;
      }

      .map-preview {
        height: 350px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <!-- Kalau belum punya foto/logo, bagian img ini boleh dihapus -->
      <img src="foto.jpg" alt="Foto Intan" class="logo">

      <h1>Web GIS Persebaran Rumah Sakit</h1>
      <h2>Kabupaten Lampung Tengah</h2>

      <div class="info">
        <div class="row">
          <strong>Nama</strong>
          <span>:</span>
          <span>Intan Nuraini Waritsina</span>
        </div>

        <div class="row">
          <strong>NPM</strong>
          <span>:</span>
          <span>2313034044</span>
        </div>

        <div class="row">
          <strong>Jurusan</strong>
          <span>:</span>
          <span>Pendidikan Geografi</span>
        </div>

        <div class="row">
          <strong>Kampus</strong>
          <span>:</span>
          <span>Universitas Lampung</span>
        </div>
      </div>

      <!-- Tombol ini menuju halaman peta -->
      <a href="map/index.html" class="btn">Mulai Jelajahi Peta</a>

      <!-- Ini tampilan peta langsung di halaman depan -->
      <div class="map-preview">
        <iframe src="map/index.html"></iframe>
      </div>

      <p class="note">
        Jika peta tidak muncul, pastikan folder map berisi file hasil export QGIS secara lengkap.
      </p>

    </div>
  </div>

</body>
</html>
